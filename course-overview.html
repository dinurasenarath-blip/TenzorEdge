<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Overview | TenzorEdge</title>

    <link rel="stylesheet" href="style.css">

</head>


<body class="customer-page">


    <div class="customer-dashboard">


        <!-- SIDEBAR -->

        <aside class="customer-sidebar">

            <div class="customer-logo">

                <img
                    src="final logo.jpeg"
                    alt="TenzorEdge"
                >

            </div>


            <nav>

                <a href="customer-dashboard.html">
                    Dashboard
                </a>

                <a href="#">
                    My Courses
                </a>

                <a href="#">
                    Progress
                </a>

                <a href="#">
                    Account
                </a>

            </nav>

        </aside>



        <!-- MAIN CONTENT -->

        <main class="customer-main">


            <button
                class="course-back-button"
                onclick="window.location.href='customer-dashboard.html'"
            >
                ← Back to Dashboard
            </button>


            <section class="course-page-header">


                <div>

                    <div class="course-label">
                        TRADING COURSE
                    </div>


                    <h1 id="courseTitle">
                        Loading...
                    </h1>


                    <p id="courseDescription">
                        Loading course information...
                    </p>

                </div>


                <div class="course-page-progress">

                    <strong>
                        Course Preview
                    </strong>

                </div>

            </section>



            <!-- COURSE OVERVIEW -->

            <section class="course-lessons">

                <h2>
                    About This Course
                </h2>


                <div id="courseOverview">

                    Loading course information...

                </div>


                <div
                    style="
                        margin-top: 30px;
                        padding: 25px;
                        background: #15151c;
                        border: 1px solid #292934;
                        border-radius: 16px;
                    "
                >

                    <h2>
                        🔒 Course Access
                    </h2>


                    <p
                        style="
                            color: #999;
                            margin-top: 10px;
                            line-height: 1.6;
                        "
                    >
                        You don't currently have access
                        to this course. Enrolment will give
                        you access to the lessons and course
                        material.
                    </p>


                    <button
                        class="course-button"
                        style="margin-top: 20px;"
                        onclick="requestEnrollment()"
                    >
                        Enrol in Course →
                    </button>


                    <p
                        id="enrolMessage"
                        style="
                            margin-top: 15px;
                            color: #8b8bff;
                        "
                    ></p>

                </div>

            </section>


        </main>

    </div>



    <script>


        // ==========================================
        // GET COURSE
        // ==========================================

        const params =
            new URLSearchParams(
                window.location.search
            );


        const courseKey =
            params.get("course");


        if (!courseKey) {

            window.location.href =
                "customer-dashboard.html";

        }



        // ==========================================
        // COURSE INFORMATION
        // ==========================================

        const courses = {

            basic: {

                title:
                    "Basic Trading",

                description:
                    "Build your foundation in trading and learn the essential concepts needed to understand the markets."

            },


            smc: {

                title:
                    "Smart Money Concepts",

                description:
                    "Explore market structure, liquidity, order blocks and other concepts used in Smart Money Concepts."

            },


            elliot_wave: {

                title:
                    "Elliot Wave",

                description:
                    "Learn the principles of Elliot Wave analysis and how wave patterns can be used to study market movements."

            }

        };


        const course =
            courses[courseKey];


        if (!course) {

            document.getElementById(
                "courseTitle"
            ).textContent =
                "Course not found";

            return;

        }


        document.getElementById(
            "courseTitle"
        ).textContent =
            course.title;


        document.getElementById(
            "courseDescription"
        ).textContent =
            course.description;


        document.getElementById(
            "courseOverview"
        ).innerHTML = `

            <div
                style="
                    padding: 25px;
                    background: #15151c;
                    border: 1px solid #292934;
                    border-radius: 16px;
                "
            >

                <p
                    style="
                        color: #999;
                        line-height: 1.7;
                    "
                >
                    ${course.description}
                </p>


                <h3 style="margin-top: 25px;">
                    What you'll learn
                </h3>


                <ul
                    style="
                        margin-top: 15px;
                        padding-left: 20px;
                        color: #999;
                        line-height: 2;
                    "
                >

                    <li>
                        Understand the key principles
                    </li>

                    <li>
                        Learn practical market analysis
                    </li>

                    <li>
                        Develop your trading knowledge
                    </li>

                </ul>

            </div>

        `;



        // ==========================================
        // ENROLMENT
        // ==========================================

        function requestEnrollment() {

            const message =
                document.getElementById(
                    "enrolMessage"
                );


            message.textContent =
                "Enrolment requests will be available soon.";

        }

    </script>


</body>

</html>
