<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Course Lessons | Trading Academy</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, Helvetica, sans-serif;

            min-height: 100vh;

            background: #0b0b0f;

            color: white;

        }


        /* ==========================================
           PAGE
        ========================================== */

        main {

            max-width: 1100px;

            margin: 0 auto;

            padding: 40px 25px;

        }


        /* ==========================================
           BACK BUTTON
        ========================================== */

        .back-button {

            display: inline-block;

            margin-bottom: 25px;

            color: white;

            text-decoration: none;

            font-weight: 600;

            opacity: 0.8;

            transition: 0.2s;

        }


        .back-button:hover {

            opacity: 1;

        }


        /* ==========================================
           COURSE HEADER
        ========================================== */

        .course-header {

            background: #0F151C;

            padding: 30px;

            border-radius: 16px;

            border: 1px solid #292934;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35);

            margin-bottom: 25px;

        }


        .course-header h1 {

            margin-bottom: 10px;

        }


        .course-header p {

            color: #999;

            line-height: 1.6;

        }


        /* ==========================================
           LESSON CREATION
        ========================================== */

        .card {

            background: #0F151C;

            padding: 25px;

            border-radius: 16px;

            border: 1px solid #292934;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.35);

            margin-bottom: 25px;

        }


        .card h2 {

            margin-bottom: 10px;

        }


        .card-description {

            color: #999;

            margin-bottom: 20px;

        }


        form {

            display: flex;

            flex-direction: column;

            gap: 15px;

        }


        input,
        textarea {

            width: 100%;

            padding: 13px 15px;

            background: #0b0b0f;

            color: white;

            border: 1px solid #292934;

            border-radius: 9px;

            font-size: 14px;

            outline: none;

        }


        textarea {

            min-height: 100px;

            resize: vertical;

            font-family: inherit;

        }


        input:focus,
        textarea:focus {

            border-color: #6c63ff;

            box-shadow:
                0 0 0 3px rgba(108, 99, 255, 0.12);

        }


        button {

            width: fit-content;

            padding: 12px 20px;

            border: none;

            border-radius: 9px;

            background: #6c63ff;

            color: white;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;

        }


        button:hover {

            background: #7c74ff;

            transform: translateY(-1px);

        }


        #lessonMessage {

            margin-top: 15px;

            color: #8b8bff;

            font-size: 14px;

        }


        /* ==========================================
           LESSON LIST
        ========================================== */

        .lesson-item {

            padding: 18px;

            background: #0b0b0f;

            border: 1px solid #292934;

            border-radius: 12px;

            margin-top: 12px;

        }


        .lesson-number {

            color: #8b8bff;

            font-size: 13px;

            font-weight: bold;

            margin-bottom: 6px;

        }


        .lesson-item h3 {

            margin-bottom: 7px;

        }


        .lesson-item p {

            color: #999;

            font-size: 14px;

            line-height: 1.5;

        }


        .lesson-video {

            margin-top: 10px;

            font-size: 13px;

            color: #aaa;

        }

        .lesson-actions {

    display: flex;

    gap: 10px;

    margin-top: 15px;

}


.edit-button {

    background: #6c63ff;

}


.edit-button:hover {

    background: #7c74ff;

}


.delete-button {

    background: #b83b3b;

}


.delete-button:hover {

    background: #d14a4a;

}


.cancel-button {

    background: #292934;

}


.cancel-button:hover {

    background: #383846;

}


    </style>

</head>


<body>


<main>


    <!-- ==========================================
         BACK
    ========================================== -->

    <a
        href="dashboard.html"
        class="back-button"
    >
        ← Back to Course Management
    </a>


    <!-- ==========================================
         COURSE HEADER
    ========================================== -->

    <section class="course-header">

        <h1 id="courseTitle">
            Loading course...
        </h1>

        <p id="courseDescription">
            Loading course information...
        </p>

    </section>


    <!-- ==========================================
         ADD LESSON
    ========================================== -->

    <section class="card">

        <h2>🎥 Add Lesson</h2>

        <p class="card-description">
            Add a lesson or video to this course.
        </p>


        <form id="lessonForm">

            <input
                type="text"
                id="lessonTitle"
                placeholder="Lesson Title"
                required
            >


            <textarea
                id="lessonDescription"
                placeholder="Lesson Description"
            ></textarea>


            <input
                type="text"
                id="lessonVideo"
                placeholder="Video URL"
            >


            <button type="submit">
                Add Lesson
            </button>

        </form>


        <p id="lessonMessage"></p>

    </section>


    <!-- ==========================================
         LESSON LIST
    ========================================== -->

    <section class="card">

        <h2>📚 Course Lessons</h2>

        <div id="lessonList">

            Loading lessons...

        </div>

    </section>


</main>


<script>


// ==========================================
// GET COURSE ID
// ==========================================

const params =
    new URLSearchParams(
        window.location.search
    );


const courseId =
    params.get("id");


if (!courseId) {

    alert("No course was selected.");

    window.location.href =
        "dashboard.html";

}


// ==========================================
// LOAD COURSE
// ==========================================

async function loadCourse() {

    try {

        const response =
            await fetch(
                `/api/admin/courses/${courseId}`
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Could not load course."
            );

            return;

        }


        document.getElementById(
            "courseTitle"
        ).textContent =
            data.course.title;


        document.getElementById(
            "courseDescription"
        ).textContent =
            data.course.description ||
            "No description provided.";


    } catch (error) {

        console.error(error);

        document.getElementById(
            "courseTitle"
        ).textContent =
            "Could not load course.";

    }

}


// ==========================================
// LOAD LESSONS
// ==========================================

async function loadLessons() {

    const lessonList =
        document.getElementById(
            "lessonList"
        );


    lessonList.textContent =
        "Loading lessons...";


    try {

        const response =
            await fetch(
                `/api/admin/courses/${courseId}/lessons`
            );


        const data =
            await response.json();


        if (!response.ok) {

            lessonList.textContent =
                data.message ||
                "Could not load lessons.";

            return;

        }


        if (data.lessons.length === 0) {

            lessonList.textContent =
                "No lessons have been added yet.";

            return;

        }


        lessonList.innerHTML = "";


        data.lessons.forEach(
            (lesson, index) => {

                const item =
                    document.createElement(
                        "div"
                    );


                item.className =
                    "lesson-item";


                item.innerHTML = `

                    <div class="lesson-number">
                        LESSON ${index + 1}
                    </div>

                    <h3>
                        ${lesson.title}
                    </h3>

                    <p>
                        ${lesson.description || ""}
                    </p>

                    ${
                        lesson.video_url
                        ? `
                            <div class="lesson-video">
                                🎥 Video added
                            </div>
                          `
                        : ""
                    }

                    <div class="lesson-actions">

                        <button
                            class="edit-button"
                            onclick="editLesson(${lesson.id})"
                        >
                            ✏️ Edit
                        </button>

                        <button
                            class="delete-button"
                            onclick="deleteLesson(${lesson.id})"
                        >
                            🗑️ Delete
                        </button>

                    </div>

                `;


                lessonList.appendChild(item);

            }
        );


    } catch (error) {

        console.error(error);

        lessonList.textContent =
            "Could not connect to the server.";

    }

}

// ==========================================
// EDIT LESSON
// ==========================================

async function editLesson(lessonId) {

    try {

        const response =
            await fetch(
                `/api/admin/courses/${courseId}/lessons`
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Could not load lesson."
            );

            return;

        }


        const lesson =
            data.lessons.find(
                lesson =>
                    lesson.id === lessonId
            );


        if (!lesson) {

            alert("Lesson not found.");

            return;

        }


        document.getElementById(
            "lessonTitle"
        ).value =
            lesson.title || "";


        document.getElementById(
            "lessonDescription"
        ).value =
            lesson.description || "";


        document.getElementById(
            "lessonVideo"
        ).value =
            lesson.video_url || "";


        const form =
            document.getElementById(
                "lessonForm"
            );


        form.dataset.editingId =
            lessonId;


        form.querySelector(
            "button[type='submit']"
        ).textContent =
            "Save Changes";


        document.getElementById(
            "lessonMessage"
        ).textContent =
            "Editing lesson. Make your changes and click Save Changes.";


        form.scrollIntoView({
            behavior: "smooth"
        });


    } catch (error) {

        console.error(error);

        alert(
            "Could not connect to the server."
        );

    }

}

// ==========================================
// CREATE / EDIT LESSON
// ==========================================

document.getElementById(
    "lessonForm"
).addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        const form = this;


        const editingId =
            form.dataset.editingId;


        const title =
            document.getElementById(
                "lessonTitle"
            ).value.trim();


        const description =
            document.getElementById(
                "lessonDescription"
            ).value.trim();


        const videoUrl =
            document.getElementById(
                "lessonVideo"
            ).value.trim();


        const message =
            document.getElementById(
                "lessonMessage"
            );


        message.textContent =
            editingId
                ? "Saving changes..."
                : "Adding lesson...";


        try {

            const url =
                editingId
                    ? `/api/admin/lessons/${editingId}`
                    : "/api/admin/lessons";


            const method =
                editingId
                    ? "PUT"
                    : "POST";


            const response =
                await fetch(
                    url,
                    {

                        method: method,

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({

                            course_id:
                                courseId,

                            title:
                                title,

                            description:
                                description,

                            video_url:
                                videoUrl

                        })

                    }
                );


            const data =
                await response.json();


            if (response.ok) {

                message.textContent =
                    editingId
                        ? "Lesson updated successfully!"
                        : "Lesson added successfully!";


                form.reset();


                delete form.dataset.editingId;


                form.querySelector(
                    "button[type='submit']"
                ).textContent =
                    "Add Lesson";


                loadLessons();


            } else {

                message.textContent =
                    data.message ||
                    "Could not save lesson.";

            }


        } catch (error) {

            console.error(error);

            message.textContent =
                "Could not connect to the server.";

        }

    }
);

// ==========================================
// DELETE LESSON
// ==========================================

async function deleteLesson(lessonId) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this lesson? This cannot be undone."
        );


    if (!confirmed) {

        return;

    }


    try {

        const response =
            await fetch(
                `/api/admin/lessons/${lessonId}`,
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Could not delete lesson."
            );

            return;

        }


        alert(
            "Lesson deleted successfully."
        );


        loadLessons();


    } catch (error) {

        console.error(error);

        alert(
            "Could not connect to the server."
        );

    }

}

// ==========================================
// START
// ==========================================

loadCourse();

loadLessons();




</script>

</body>

</html>
