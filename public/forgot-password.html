<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Forgot Password | Trading Academy</title>

<link rel="stylesheet" href="style.css">

<link
    rel="shortcut icon"
    type="image/jpg"
    href="FAVICON.png"
>


</head>

<body>


<div class="login-container">

    <div class="login-box">

        <div class="brand">

            <img
                src="final logo.jpeg"
                alt="logo"
            >

        </div>


        <h2 style="padding-top: 10px;">
            Forgot Password?
        </h2>


        <p class="subtitle">

            Enter your username and we'll send
            your request to the administrator.

        </p>


        <form id="forgotPasswordForm">


            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                    autocomplete="username"
                >

            </div>


            <button
                type="submit"
                class="login-button"
            >
                Send Password Request
            </button>


            <p
                id="message"
                class="error-message"
            ></p>


        </form>


        <div style="margin-top: 20px;">

            <a
                href="index.html"
                style="text-decoration: none;"
            >
                ← Back to Login
            </a>

        </div>


    </div>

</div>


<script>

    const forgotPasswordForm =
        document.getElementById(
            "forgotPasswordForm"
        );

    const message =
        document.getElementById(
            "message"
        );


    forgotPasswordForm.addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const username =
                document
                    .getElementById("username")
                    .value
                    .trim();


            message.textContent = "";


            if (!username) {

                message.textContent =
                    "Please enter your username.";

                return;

            }


            try {

                const response =
                    await fetch(
                        "/api/forgot-password",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body: JSON.stringify({
                                username: username
                            })

                        }
                    );


                const data =
                    await response.json();


                if (response.ok) {

                    message.style.color =
                        "#27ae60";

                    message.textContent =
                        data.message ||
                        "Your password request has been sent.";

                    forgotPasswordForm.reset();

                } else {

                    message.style.color =
                        "#c0392b";

                    message.textContent =
                        data.message ||
                        "Could not send password request.";

                }


            } catch (error) {

                console.error(error);

                message.style.color =
                    "#c0392b";

                message.textContent =
                    "Could not connect to the server.";

            }

        }
    );

</script>


</body>

</html>
